<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" fill="none">
  <!-- Clean White Card & Dark Outer Border -->
  <rect width="1000" height="750" fill="#FFFFFF"/>
  <rect x="12" y="12" width="976" height="726" fill="none" stroke="#1C1D1F" stroke-width="12"/>

  <!-- Top Left: Udemy Logo -->
  <g transform="translate(60, 80)">
    <!-- Udemy inverted chevron symbol -->
    <path d="M12 4 L26 18 L40 4" stroke="#A435F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="0" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#1C1D1F" letter-spacing="-1.5">ûdemy</text>
  </g>

  <!-- Top Right: Certificate Verification Metadata -->
  <g transform="translate(930, 80)" text-anchor="end">
    <text y="15" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#6A6F73">
      Certificate no: UC-8597eacc-045c-465b-8bcf-230f2332fa0c
    </text>
    <text y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#6A6F73">
      Certificate url: ude.my/UC-8597eacc-045c-465b-8bcf-230f2332fa0c
    </text>
    <text y="49" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#6A6F73">
      Reference Number: 0004
    </text>
  </g>

  <!-- Section: CERTIFICATE OF COMPLETION -->
  <g transform="translate(60, 240)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#6A6F73" letter-spacing="1.5">
      CERTIFICATE OF COMPLETION
    </text>

    <!-- Course Title -->
    <text y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800" fill="#1C1D1F" letter-spacing="-0.5">
      Advanced Excel Course for
    </text>
    <text y="112" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800" fill="#1C1D1F" letter-spacing="-0.5">
      Job and Real World
    </text>

    <!-- Instructors -->
    <text y="165" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#6A6F73">
      Instructors <tspan font-weight="700" fill="#1C1D1F">Zechariah Tech</tspan>
    </text>
  </g>

  <!-- Lower Section: Recipient & Date -->
  <g transform="translate(60, 560)">
    <!-- Student Name -->
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="800" fill="#1C1D1F">
      Shivanya mishra
    </text>

    <!-- Date -->
    <text y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#6A6F73">
      Date <tspan font-weight="700" fill="#1C1D1F">May 24, 2025</tspan>
    </text>

    <!-- Length -->
    <text y="78" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#6A6F73">
      Length <tspan font-weight="700" fill="#1C1D1F">4.5 total hours</tspan>
    </text>
  </g>
