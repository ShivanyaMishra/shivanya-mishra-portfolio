<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100" fill="none">
  <!-- Elegant Parchment Background & Golden Guilloche Border Frame -->
  <rect width="850" height="1100" fill="#FCFAF2"/>
  
  <!-- Outer Filigree Gold Border -->
  <rect x="25" y="25" width="800" height="1050" fill="none" stroke="#D4AF37" stroke-width="4"/>
  <rect x="35" y="35" width="780" height="1030" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="42" y="42" width="766" height="1016" fill="none" stroke="#E6C875" stroke-width="0.8"/>

  <!-- Ornate Corner Embellishments -->
  <g stroke="#C5A059" stroke-width="1.5" fill="none">
    <path d="M45 75 C65 55 65 55 85 45 M55 45 L45 55 M45 95 C85 65 85 65 105 45"/>
    <path d="M805 75 C785 55 785 55 765 45 M795 45 L805 55 M805 95 C765 65 765 65 745 45"/>
    <path d="M45 1025 C65 1045 65 1045 85 1055 M55 1055 L45 1045 M45 1005 C85 1035 85 1035 105 1055"/>
    <path d="M805 1025 C785 1045 785 1045 765 1055 M795 1055 L805 1045 M805 1005 C765 1035 765 1035 745 1055"/>
  </g>

  <!-- Top Metadata Boxes -->
  <!-- Date of Issue (Top Left) -->
  <g transform="translate(65, 80)">
    <text x="0" y="20" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#2C2C2C">Date</text>
    <text x="0" y="34" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#2C2C2C">of Issue</text>
    <rect x="52" y="5" width="105" height="35" rx="6" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="1"/>
    <text x="104" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#1C1D1F">8-Mar-2025</text>
  </g>

  <!-- Serial Number (Top Right) -->
  <g transform="translate(525, 80)">
    <text x="0" y="27" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#2C2C2C">Sr. No.</text>
    <rect x="48" y="5" width="205" height="35" rx="6" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="1"/>
    <text x="150" y="27" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#1C1D1F">CR1003528250308140005972033</text>
  </g>

  <!-- Aptech Learning Logo (Center Header) -->
  <g transform="translate(370, 140)">
    <rect x="0" y="0" width="125" height="48" rx="4" fill="#212529"/>
    <!-- Yellow paw icon -->
    <circle cx="95" cy="14" r="3" fill="#FFC107"/>
    <circle cx="102" cy="12" r="2.5" fill="#FFC107"/>
    <circle cx="107" cy="15" r="2" fill="#FFC107"/>
    <ellipse cx="101" cy="20" rx="4" ry="3" fill="#FFC107"/>
    <text x="10" y="28" font-family="'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">Aptech</text>
    <text x="10" y="42" font-family="'Arial', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">LEARNING</text>
    <text x="62" y="60" text-anchor="middle" font-family="'Georgia', serif" font-size="8" font-style="italic" fill="#666666">Unleash your potential</text>
  </g>

  <!-- Certificate of Merit Title -->
  <text x="425" y="245" text-anchor="middle" font-family="'Brush Script MT', 'Great Vibes', 'Edwardian Script ITC', 'Georgia', cursive, serif" font-size="44" font-weight="600" fill="#3D382A" letter-spacing="1">Certificate of Merit</text>

  <!-- Awarded By Text -->
  <text x="425" y="295" text-anchor="middle" font-family="'Georgia', serif" font-size="16" font-style="italic" fill="#333333">This certificate is awarded by</text>
  <text x="425" y="325" text-anchor="middle" font-family="'Georgia', serif" font-size="17" font-style="italic" font-weight="600" fill="#222222">Dept. of Information Technology, a Division of Aptech Ltd.</text>
  <text x="425" y="365" text-anchor="middle" font-family="'Georgia', serif" font-size="15" font-style="italic" fill="#555555">to</text>

  <!-- Student Name -->
  <text x="425" y="405" text-anchor="middle" font-family="'Arial', sans-serif" font-size="20" font-weight="600" fill="#222222" letter-spacing="1.5">SIVANYA MISHRA</text>
  <line x1="225" y1="415" x2="625" y2="415" stroke="#444444" stroke-width="1"/>

  <!-- Date Text -->
  <text x="425" y="450" text-anchor="middle" font-family="'Georgia', serif" font-size="15" font-style="italic" fill="#333333">
    on the <tspan font-family="'Courier New', monospace" font-size="16" font-weight="700" font-style="normal" text-decoration="underline">28TH</tspan> day of the month of <tspan font-family="'Courier New', monospace" font-size="16" font-weight="700" font-style="normal" text-decoration="underline">FEBRUARY</tspan>
  </text>

  <text x="425" y="485" text-anchor="middle" font-family="'Georgia', serif" font-size="15" font-style="italic" fill="#333333">
    in the year <tspan font-family="'Courier New', monospace" font-size="16" font-weight="700" font-style="normal" text-decoration="underline">2025</tspan> for successfully completing the following course
  </text>

  <!-- Course Title -->
  <text x="425" y="535" text-anchor="middle" font-family="'Georgia', serif" font-size="22" font-weight="700" fill="#1A1A1A" letter-spacing="1">JAVA PROGRAMMING</text>
  <line x1="220" y1="545" x2="630" y2="545" stroke="#444444" stroke-width="1"/>

  <!-- Hours and Centre -->
  <text x="425" y="580" text-anchor="middle" font-family="'Georgia', serif" font-size="15" font-style="italic" fill="#333333">
    of <tspan font-family="'Courier New', monospace" font-size="16" font-weight="700" font-style="normal" text-decoration="underline">72 HOURS</tspan> duration at the
  </text>

  <text x="425" y="618" text-anchor="middle" font-family="'Georgia', serif" font-size="16" font-weight="700" fill="#222222">
    <tspan font-style="normal">DELHI NCR-GURGAON-SECTOR 14</tspan> <tspan font-style="italic" font-weight="400">centre during</tspan>
  </text>
  <line x1="170" y1="626" x2="680" y2="626" stroke="#444444" stroke-width="1"/>

  <!-- Period and Grade -->
  <text x="425" y="660" text-anchor="middle" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#333333">
    the period from <tspan font-family="'Courier New', monospace" font-size="14" font-weight="700" font-style="normal" text-decoration="underline">23-Oct-2023</tspan> to <tspan font-family="'Courier New', monospace" font-size="14" font-weight="700" font-style="normal" text-decoration="underline">28-Feb-2025</tspan> with grade* of <tspan font-family="'Courier New', monospace" font-size="15" font-weight="800" font-style="normal" text-decoration="underline">DISTINCTION</tspan>
  </text>

  <!-- Digital Signature Verification Center Box -->
  <g transform="translate(380, 680)">
    <text x="45" y="12" text-anchor="middle" font-family="'Arial', sans-serif" font-size="10" font-weight="600" fill="#333333">Validity unknown</text>
    <rect x="25" y="18" width="40" height="35" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
    <!-- Yellow question mark icon -->
    <text x="45" y="42" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" fill="#F59E0B">?</text>
    <text x="45" y="65" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="700" fill="#222222">Aptech</text>
  </g>

  <!-- Signatures -->
  <!-- Left Signature -->
  <g transform="translate(200, 715)">
    <path d="M0 25 Q20 5 45 30 Q70 10 95 28 Q115 5 130 20" stroke="#1A202C" stroke-width="2" fill="none"/>
    <text x="65" y="55" text-anchor="middle" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#4A5568">Authorized Signatory</text>
    <text x="65" y="70" text-anchor="middle" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#718096">on behalf of Controller of Exams</text>
  </g>

  <!-- Right Signature -->
  <g transform="translate(560, 715)">
    <path d="M0 20 Q15 0 35 25 Q55 5 80 20 Q105 -5 130 25" stroke="#1A202C" stroke-width="2" fill="none"/>
    <text x="65" y="55" text-anchor="middle" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#4A5568">Authorized Signatory</text>
    <text x="65" y="70" text-anchor="middle" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#718096">on behalf of Board of Examiners</text>
  </g>

  <!-- Divider Rule -->
  <line x1="80" y1="830" x2="770" y2="830" stroke="#C5A059" stroke-width="1"/>

  <!-- Footer Grading Scale & Legal Text -->
  <g transform="translate(425, 860)" text-anchor="middle">
    <text y="0" font-family="'Georgia', serif" font-size="13" font-weight="600" fill="#333333">
      The students will be awarded Grade on the Overall Weighted Final Marks
    </text>
    <text y="24" font-family="'Georgia', serif" font-size="12" fill="#444444">
      <tspan font-weight="700">Grades*:</tspan> ≥40% but &lt;60% : Pass | ≥60% but &lt;75% : Credit | ≥75% : Distinction
    </text>
    <text y="48" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#666666">
      Note: To attain PASS/CREDIT/DISTINCTION Grade, a student should achieve at least 40% in each of the Components of the Examination.
    </text>
  </g>

  <!-- Footnote address -->
  <text x="425" y="960" text-anchor="middle" font-family="'Arial', sans-serif" font-size="9.5" fill="#777777">
    Issued by Aptech Limited having its registered office at Aptech House, A-65, M.I.D.C., Marol, Andheri (E), Mumbai - 400093, Maharashtra, India.
  </text>
  <text x="750" y="980" text-anchor="end" font-family="'Arial', sans-serif" font-size="8.5" font-style="italic" fill="#999999">
    Aptech Learning is not a university.
  </text>
</svg>
